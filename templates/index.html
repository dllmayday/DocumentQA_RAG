<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Agent - 本地知识库问答系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .chat-container {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message { margin-bottom: 16px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { text-align: right; }
        .message-content {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-label { font-size: 12px; color: #888; margin-bottom: 4px; }
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        .input-wrapper { display: flex; gap: 12px; }
        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-wrapper input:focus { border-color: #667eea; }
        .input-wrapper button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-wrapper button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .input-wrapper button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
        }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .clear-btn { background: none; border: none; color: #667eea; cursor: pointer; font-size: 12px; }
        .clear-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RAG Agent</h1>
            <p>基于 Ollama 本地模型的知识库问答系统</p>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-label">Assistant</div>
                <div class="message-content">
                    你好！我是 RAG Agent，可以根据本地知识库回答你的问题。
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="请输入您的问题..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">服务正常</span>
            </div>
            <button class="clear-btn" onclick="clearChat()">清空对话</button>
        </div>
    </div>
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let isStreaming = false;

        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                if (res.ok) {
                    document.getElementById('statusDot').classList.remove('offline');
                    document.getElementById('statusText').textContent = '服务正常';
                }
            } catch (e) {
                document.getElementById('statusDot').classList.add('offline');
                document.getElementById('statusText').textContent = '服务不可用';
            }
        }
        checkHealth();
        setInterval(checkHealth, 30000);

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query || isStreaming) return;
            isStreaming = true;
            sendBtn.disabled = true;
            userInput.value = '';
            addMessage('user', query);
            const assistantMsg = addMessage('assistant', '', true);
            try {
                const response = await fetch(`/api/chat/stream?query=${encodeURIComponent(query)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let answerText = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    answerText += decoder.decode(value);
                    updateMessage(assistantMsg, answerText);
                }
            } catch (e) {
                updateMessage(assistantMsg, '抱歉，服务出现了问题，请稍后重试。');
            }
            isStreaming = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(role, content, placeholder = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? 'You' : 'Assistant';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (placeholder) {
                contentDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            } else {
                contentDiv.textContent = content;
            }
            msgDiv.appendChild(label);
            msgDiv.appendChild(contentDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return contentDiv;
        }

        function updateMessage(element, content) {
            element.textContent = content;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="message assistant">
                    <div class="message-label">Assistant</div>
                    <div class="message-content">对话已清空，请继续提问！</div>
                </div>`;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
